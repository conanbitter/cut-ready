help = """
Использование:
  cut-ready <файл>
  cut-ready --convert [--include-sub] <входной файл/папка> [<выходной файл/папка>]
  cut-ready --help

Параметры:
  -h --help         Показать экран с помощью

  -c --convert      Конвертировать из формата DIE в формат DXF один файл
                    или все файлы в папке

  -i --include-sub  Конвертируя все файлы в папке,
                    также включать и подпапки
"""

