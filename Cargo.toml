[package]
name = "cut-ready"
version = "0.4.1"
edition = "2024"
description = "DXF file checker for CNC cutters"

[dependencies]
anyhow = "1.0.104"
dxf = "0.6.2"
encoding_rs = "0.8.42"
encoding_rs_io = "0.1.8"
enterpolation = { version = "0.3.0", default-features = false, features = ["std", "bspline"] }
futures = "0.3.34"
rfd = "0.17.2"
rust-i18n = "4.2.4"
softbuffer = "0.4.8"
sys-locale = "0.3.2"
tiny-skia = "0.12.0"
tinyjson = "2.5.1"
walkdir = "2.5.0"
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Console"] }

[build-dependencies]
winresource = "0.1.34"
